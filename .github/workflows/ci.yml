name: Verify field service
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
  rules-and-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/FieldService.Tests -c Release
  api-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/setup.sh
      - run: docker compose up -d --build
      - run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health; then break; fi
            sleep 2
          done
          python3 scripts/check-workflow.py
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: dotnet workload install maui-android
      - run: dotnet build mobile/FieldService.Mobile -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSdkLicenses=true
      - run: dotnet build mobile/FieldService.Mobile -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: field-service-android-debug
          path: mobile/FieldService.Mobile/bin/Debug/net10.0-android/*-Signed.apk
